data:
  labels_csv: data/raw/train.csv
  images_dir: data/raw/jpeg/train
  clean_csv: reports/eda/clean_train.csv
  eda_dir: reports/eda
  splits_csv: splits/folds.csv
  output_dir: outputs/baseline
  report_dir: reports/baseline
eda:
  dark_pixel_threshold: 32
model:
  device: auto
  batch_size: 32
  num_workers: 0
  weights_path: null  # pretrained weights downloaded by torchvision if null
validation:
  n_splits: 5
  seed: 42
logreg:
  C: 1.0
  solver: liblinear
  l1_ratio: 0.0  # L2 regularization (sklearn 1.8+)
  max_iter: 2000
  tol: 0.0001
  class_weights: [null, balanced]
