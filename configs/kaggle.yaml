data:
  labels_csv: /kaggle/input/competitions/siim-isic-melanoma-classification/train.csv
  images_dir: /kaggle/input/competitions/siim-isic-melanoma-classification/jpeg/train
  clean_csv: /kaggle/working/reports/eda/clean_train.csv
  eda_dir: /kaggle/working/reports/eda
  splits_csv: /kaggle/working/splits/folds.csv
  output_dir: /kaggle/working/outputs/baseline
  embeddings_cache: /kaggle/working/outputs/baseline/embeddings.npz
  report_dir: /kaggle/working/reports/baseline
  figure_dir: /kaggle/working/reports/figures
resolution_analysis:
  top_n: 10
  min_positive: 10
experiments:
  variants: [B0, B1, M-full, A-age, A-sex, A-site]
wandb:
  enabled: false  # Set true after installing/authenticating W&B.
  project: siim-isic-melanoma
  entity: null
  mode: online
  group: metadata_experiment
eda:
  dark_pixel_threshold: 32
model:
  device: auto
  batch_size: 32
  num_workers: 2
  weights_path: null
validation:
  n_splits: 5
  seed: 42
logreg:
  C: 1.0
  solver: liblinear
  l1_ratio: 0.0  # L2 regularization (sklearn 1.8+)
  max_iter: 2000
  tol: 0.0001
  class_weights: [null, balanced]
